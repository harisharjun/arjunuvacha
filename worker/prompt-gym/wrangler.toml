# prompt-gym worker — Cloudflare config
# The API and grading engine for PromptGym. Unlike arjun-rag and
# tax-copilot-groq this one is TypeScript with a src/ tree, because it holds
# the grading engine whose correctness decides whether every leaderboard score
# means anything. See docs/repo-layout.md §5.
name = "prompt-gym"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# Groq calls route through the same Cloudflare AI Gateway as the other workers.
[vars]
AIG_ACCOUNT = "817ef4ab39edc6b855e3338a6903f3eb"
AIG_GATEWAY = "vani"
# Not a secret — it is the `aud` an ID token must carry to be accepted here, and
# it appears in the browser's own Firebase config. One project for both the
# staging and production frontends: they share sign-in, though not a database.
FIREBASE_PROJECT_ID = "arjunuvacha-3de80"

# Guardrails (M8). Vars rather than constants because Groq publishes its free-tier
# ceilings per organisation and moves them — check yours under Settings → Limits.
# These sit under the published 8K tokens/minute and 200K tokens/day so that KV's
# eventual consistency overshoots into headroom rather than into a 429.
# Omit any of them and `src/budget.ts` uses its own defaults, which are these.
BUDGET_TOKENS_PER_DAY = "180000"
BUDGET_TOKENS_PER_MINUTE = "7000"
# Submission limits (26 Sep 2026). Guests are counted per connection, since a
# guest can mint a new anonymous account by clearing storage; signed-in players
# per account. Every submission counts, including a repeat served from the cache.
GUEST_RUNS_PER_HOUR = "5"
USER_RUNS_PER_MINUTE = "3"
USER_RUNS_PER_HOUR = "15"
USER_RUNS_PER_DAY = "100"
# Site-wide daily ceiling on paid (OpenAI) tokens, whatever the number of
# accounts. ~3M is roughly $1-5 a day depending on the nano/mini mix.
OPENAI_TOKENS_PER_DAY = "3000000"

# Secret, set with `wrangler secret put OPENAI_API_KEY` (and `--env staging`):
#   OPENAI_API_KEY -> signed-in players run on gpt-4.1-nano / gpt-4.1-mini.
#   Without it they fall back to the Groq models.

# Secret (set with `wrangler secret put GROQ_API_KEY`, do NOT put the value here):
#   GROQ_API_KEY  -> the existing gsk_… key (same one arjun-rag / vani use)

# Feedback emails (26 Sep 2026), via Resend. Two secrets, both needed:
#   npx wrangler secret put RESEND_API_KEY   -> re_… from resend.com/api-keys
#   npx wrangler secret put FEEDBACK_TO      -> the address the Resend account
#                                               was registered with
# Kept as a secret rather than a var so the address is not published in the repo.
# Without either one, feedback is still saved to D1 — it just is not emailed.
# The sender defaults to onboarding@resend.dev, which Resend delivers only to the
# account's own address; set FEEDBACK_FROM here once a domain is verified there.

# Every submission is written here, by the Worker and only by the Worker. That is
# what makes the leaderboard defensible: a client can never post its own score.
#
# Apply migrations with:
#   npx wrangler d1 migrations apply promptgym --local    (local dev)
#   npx wrangler d1 migrations apply promptgym --remote   (production)
# 0002_feedback.sql adds the feedback table and must be applied before deploying
# the code that writes to it.
[[d1_databases]]
binding = "DB"
database_name = "promptgym"
database_id = "3713edb6-3c4c-4b81-a171-4ffb19ace107"
migrations_dir = "migrations"

# The shared-budget and per-IP rate-limit counters. Create the namespace and paste
# the id it prints, on a machine with Cloudflare auth:
#
#   npx wrangler kv namespace create BUDGET
#
# The Worker still runs without this — `src/index.ts` skips both checks when
# `env.BUDGET` is absent, on the grounds that a missing counter should not take the
# site down. Which is exactly why it has to be bound: with no binding there is no
# budget, and Groq's own 429 would be the only thing standing between a LinkedIn
# post and an empty daily allowance.
#
# Created 26 Sep 2026.
[[kv_namespaces]]
binding = "BUDGET"
id = "5e390c8016f94850b8fcea49b432c859"

# Workers AI, for the embeddings behind the `similar` assertions in pg-c1 and
# pg-c5. Groq has no embeddings endpoint, so these go to Cloudflare instead.
#
# The binding needs no id and no token — unlike KV above, this one is complete as
# written. Without it those assertions stay pending and both challenges correctly
# report `leaderboardEligible: false`.
#
# Pinned model: @cf/baai/bge-base-en-v1.5 (see src/providers/embeddings.ts).
# Changing it changes every similarity score, and so every historical grade a new
# one would be compared against.
[ai]
binding = "AI"

# For `npm run try -- <id> --live` on the laptop there is no binding, so the same
# embeddings go over the REST API. Add to .dev.vars (gitignored):
#   CF_ACCOUNT_ID=<your Cloudflare account id>
#   CF_API_TOKEN=<an API token with Workers AI read>
# Without them --live still works; `similar` just stays pending.

# ─────────────────────────────────────────────────────────────── staging
# A second Worker for the staging site (arjunuvacha-test.web.app), so staging can
# run code production has not got yet — a sign-in wall or a new ranking would
# otherwise change the live site the moment staging was deployed. The page picks
# this Worker by hostname (see `API` in web/app.js).
#
# Its own D1 (since 26 Sep 2026), so testing on staging can never put a score on
# the live leaderboard, share a result into the live gallery, or email a test
# message as if a player had sent it. The KV stays shared, deliberately: it holds
# the Groq and OpenAI budgets, and those are one real allowance whichever site
# spends them. Bindings and vars do not inherit into an environment, so they are
# all repeated here. Deploy with:
#   npx wrangler deploy --env staging
# Its secrets are set separately:
#   npx wrangler secret put GROQ_API_KEY --env staging
#   npx wrangler secret put OPENAI_API_KEY --env staging
#   npx wrangler secret put RESEND_API_KEY --env staging   (optional)
#   npx wrangler secret put FEEDBACK_TO --env staging      (optional)
[env.staging]
name = "prompt-gym-staging"

[env.staging.vars]
AIG_ACCOUNT = "817ef4ab39edc6b855e3338a6903f3eb"
AIG_GATEWAY = "vani"
FIREBASE_PROJECT_ID = "arjunuvacha-3de80"
BUDGET_TOKENS_PER_DAY = "180000"
BUDGET_TOKENS_PER_MINUTE = "7000"
GUEST_RUNS_PER_HOUR = "5"
USER_RUNS_PER_MINUTE = "3"
USER_RUNS_PER_HOUR = "15"
USER_RUNS_PER_DAY = "100"
OPENAI_TOKENS_PER_DAY = "3000000"

# Create it once, paste the id it prints over the placeholder, then build its
# schema from the same migrations production has:
#   npx wrangler d1 create promptgym-staging
#   npx wrangler d1 migrations apply promptgym-staging --remote --env staging
#
# The placeholder is deliberate. Until it is replaced, `deploy --env staging`
# fails loudly — which is the point: the alternative is staging quietly writing
# to production's database again.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "promptgym-staging"
database_id = "REPLACE-WITH-ID-FROM-wrangler-d1-create-promptgym-staging"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "BUDGET"
id = "5e390c8016f94850b8fcea49b432c859"

[env.staging.ai]
binding = "AI"
