<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptGym</title>
<meta name="description" content="Practise prompt engineering against real test suites and get graded, structured feedback on where your prompt breaks.">
<!-- Root-relative, not relative. Firebase rewrites every path under /prompt-gym/**
     to this file, so a share link at /prompt-gym/r/<id> would resolve "styles.css"
     to /prompt-gym/r/styles.css — which the rewrite serves as this HTML, leaving the
     page unstyled and the module script unparseable. -->
<link rel="stylesheet" href="/prompt-gym/styles.css">

<!-- A generic card, not a per-result one. Firebase Hosting serves /prompt-gym/**
     from static files and its rewrites cannot target a Cloudflare Worker, so
     there is nowhere to inject per-result tags. See docs/repo-layout.md §6. -->
<meta property="og:title" content="PromptGym">
<meta property="og:description" content="Write a prompt. Run it against hidden test cases. Find out where it breaks.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://arjunuvacha.com/prompt-gym/">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>PromptGym</h1>
        <p class="tagline">Write a prompt. Run it against hidden test cases. Find out where it breaks.</p>
      </div>
      <div id="account">
        <span id="account-label" class="muted"></span>
        <button id="signin" class="secondary" hidden>Sign in with Google</button>
        <button id="signout" class="link" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <nav id="tabs">
    <button id="tab-challenges" class="tab active">Challenges</button>
    <button id="tab-leaderboard" class="tab">Leaderboard</button>
  </nav>

  <main>
    <section id="list-view">
      <div id="progress-strip" class="progress" hidden></div>
      <h2>Challenges</h2>
      <p id="list-status" class="muted">Loading…</p>
      <ul id="challenge-list"></ul>
    </section>

    <section id="play-view" hidden>
      <button id="back" class="link">← All challenges</button>

      <h2 id="play-title"></h2>
      <div id="play-meta" class="muted"></div>

      <p id="play-goal"></p>

      <details id="play-detail">
        <summary>What this is graded on</summary>
        <div id="play-constraints"></div>
      </details>

      <label for="prompt">Your prompt</label>
      <textarea id="prompt" rows="10" spellcheck="false"
        placeholder="Write the prompt that solves the task above…"></textarea>
      <div class="editor-foot">
        <span id="charcount" class="muted"></span>
        <span class="spacer"></span>
        <label for="model" class="muted">Model</label>
        <select id="model"></select>
        <button id="run" class="primary">Run</button>
      </div>

      <div id="run-status" role="status" aria-live="polite"></div>
      <div id="scorecard"></div>
    </section>

    <section id="result-view" hidden>
      <button id="result-back" class="link">← All challenges</button>
      <h2>Shared result</h2>
      <p id="result-status" class="muted">Loading…</p>
      <div id="result-card"></div>
    </section>

    <section id="board-view" hidden>
      <h2>Leaderboard</h2>
      <p class="muted">Ranked by challenges completed. Ties are broken by total score.</p>
      <p id="board-status" class="muted">Loading…</p>
      <table id="board" hidden>
        <thead>
          <tr><th>#</th><th>Player</th><th>Completed</th><th>Total</th></tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
      <div id="board-you"></div>
    </section>
  </main>

  <script type="module" src="/prompt-gym/app.js"></script>
</body>
</html>
