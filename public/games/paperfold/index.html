      <div class="brand">

  <main class="play">
    <!-- A hidden sheet of every picture, for the squares of paper to show their part of. -->
    <svg id="artDefs" width="0" height="0" aria-hidden="true" style="position:absolute"></svg>

    <div class="status">
      <span id="levelName"></span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="foldCount"></span>
    </div>

    <svg id="board" viewBox="0 0 340 390" role="img" aria-label="A sheet of paper to fold, and a small picture of the result to make. Drag the paper across a dashed line to fold it."></svg>

    <div class="tools" id="tools">
      <button class="btn" id="undoBtn" type="button">Undo</button>
      <button class="btn" id="resetBtn" type="button">Start over</button>
      <button class="btn" id="hintBtn" type="button">Hint</button>
    </div>

    <div class="win" id="win" role="status" hidden>
      <p class="win-title" id="winTitle"></p>
      <p class="win-sub" id="winSub"></p>
      <div class="win-actions">
        <button class="btn primary" id="nextBtn" type="button">Next level</button>
        <button class="btn" id="shareBtn" type="button">Share</button>
        <button class="btn" id="againBtn" type="button">Play again</button>
      </div>
    </div>
  </main>

  <dialog class="how" id="how" aria-labelledby="howTitle">
    <div class="how-head">
      <span id="howCount"></span>
      <button class="btn slim" id="howClose" type="button">Close</button>
    </div>
    <h2 id="howTitle"></h2>
    <p class="how-text" id="howText" aria-live="polite"></p>
    <svg id="howStage" viewBox="0 0 300 250" aria-hidden="true"></svg>
    <p class="how-note" id="howNote" aria-live="polite"></p>
    <div class="how-nav">
      <button class="btn" id="howBack" type="button">Back</button>
      <div class="how-dots" id="howDots"></div>
      <button class="btn primary" id="howNext" type="button">Next</button>
    </div>
  </dialog>

  <dialog class="map" id="map" aria-labelledby="mapTitle">
    <div class="map-head">
      <h2 id="mapTitle">Levels</h2>
      <button class="btn slim" id="mapClose" type="button">Close</button>
    </div>
    <p class="map-note" id="mapNote"></p>
    <div class="map-grid" id="mapGrid"></div>
  </dialog>
